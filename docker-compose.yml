services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: animeuser
      POSTGRES_PASSWORD: animepass
      POSTGRES_DB: animetracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animeuser -d animetracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://animeuser:animepass@db:5432/animetracker
      SECRET_KEY: local-dev-secret-change-in-prod
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: